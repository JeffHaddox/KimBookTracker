<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read Between</title>
<meta name="description" content="A reading journal: track the books you have read, plan what is next, and see your reading stats.">
<meta name="theme-color" content="#F2EEF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Read Between">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a moonlit reading journal. Starry lilac paper, jewel-toned clothbound covers with gold foil, a walnut shelf with a crescent bookend, serif italics for the voice. */
:root {
  --bg: #F2EEF4;
  --speck: #D6CCE0;
  --surface: #FFFCF8;
  --surface-2: #EBE5EF;
  --fg: #2A2140;
  --muted: #6B6280;
  --line: #DAD2E2;
  --hair: #E8E2EC;
  --gold: #9C7322;
  --gold-soft: #E3CF9E;
  --on-gold: #FFFCF5;
  --accent: #1F6560;
  --accent-fg: #FFFCF8;
  --rose: #B04F64;
  --ring: rgba(31, 101, 96, 0.18);
  --star: #C9962E;
  --star-off: #DDD5E4;
  --shadow: rgba(42, 33, 64, 0.10);
  --shadow-2: rgba(42, 33, 64, 0.22);
  --wood: #5E3D2C;
  --wood-dark: #3E271C;
  --danger: #A8324A;
  --on-danger: #FFFCF8;
  --scrim: rgba(28, 22, 44, 0.5);
  --overlay: rgba(255, 252, 248, 0.97);
  /* Pastel tints keep ink text in both themes */
  --sage: #D3E0CF;
  --blush: #F3D8D4;
  --lavender: #DED6F1;
  --mist: #D2E3EC;
  --butter: #F2E5BD;
  --seafoam: #CFE8DE;
  --tint-ink: #2A2140;
  --foil: #D8B45A;
  --hi: #B04F64;
  --med: #C9962E;
  --lo: #3E8A73;
  --serif: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15121F; --speck: #3F3859; --surface: #201C2E; --surface-2: #2A2540; --fg: #F3ECDD; --muted: #B3AAC2;
    --line: #3A3352; --hair: #2F2944; --gold: #E2BF66; --gold-soft: #5E4D27; --on-gold: #1A1526;
    --accent: #7FCFC5; --accent-fg: #15121F; --rose: #EB97A6; --ring: rgba(127, 207, 197, 0.22);
    --star: #E2BF66; --star-off: #3E3756; --shadow: rgba(0, 0, 0, 0.3); --shadow-2: rgba(0, 0, 0, 0.55);
    --wood: #4A2F22; --wood-dark: #2A1A12; --danger: #F08A9C; --on-danger: #15121F;
    --scrim: rgba(0, 0, 0, 0.6); --overlay: rgba(32, 28, 46, 0.97);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15121F; --speck: #3F3859; --surface: #201C2E; --surface-2: #2A2540; --fg: #F3ECDD; --muted: #B3AAC2;
  --line: #3A3352; --hair: #2F2944; --gold: #E2BF66; --gold-soft: #5E4D27; --on-gold: #1A1526;
  --accent: #7FCFC5; --accent-fg: #15121F; --rose: #EB97A6; --ring: rgba(127, 207, 197, 0.22);
  --star: #E2BF66; --star-off: #3E3756; --shadow: rgba(0, 0, 0, 0.3); --shadow-2: rgba(0, 0, 0, 0.55);
  --wood: #4A2F22; --wood-dark: #2A1A12; --danger: #F08A9C; --on-danger: #15121F;
  --scrim: rgba(0, 0, 0, 0.6); --overlay: rgba(32, 28, 46, 0.97);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; min-height: 100vh; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 12% 18%, var(--speck) 1.2px, transparent 1.6px),
    radial-gradient(circle at 68% 42%, var(--speck) 1px, transparent 1.4px),
    radial-gradient(circle at 38% 74%, var(--gold-soft) 1.5px, transparent 1.9px),
    radial-gradient(circle at 86% 86%, var(--speck) 1.1px, transparent 1.5px);
  background-size: 180px 180px, 240px 240px, 330px 330px, 150px 150px;
  color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-block: 26px 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; color: var(--fg); flex: none; }
.wordmark { font-family: var(--serif); font-weight: 600; font-size: 2.2rem; line-height: 1; letter-spacing: -0.02em; margin: 0; font-variation-settings: "opsz" 144; }
.wordmark em { font-style: italic; font-weight: 400; color: var(--accent); padding-bottom: 0.12em;
  background: linear-gradient(var(--gold), var(--gold)) left bottom 0.02em / 100% 1px no-repeat,
              linear-gradient(var(--gold), var(--gold)) left bottom 0.14em / 100% 1px no-repeat; }
.tagline { margin: 5px 0 0; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: 0.88rem; line-height: 1.2; text-decoration: none; box-shadow: 0 1px 2px var(--shadow); transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px -6px var(--shadow-2); }
.btn:active { transform: translateY(0); box-shadow: 0 1px 2px var(--shadow); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.hot { background: var(--gold); color: var(--on-gold); border-color: transparent; }
.btn.hot::before { content: '✦'; font-size: 0.8em; }
.btn.danger { background: var(--danger); color: var(--on-danger); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); transform: none; box-shadow: none; text-decoration: underline; text-underline-offset: 3px; }
.btn.sm { padding: 6px 12px; font-size: 0.78rem; }
.btn.icon { width: 34px; padding: 6px 0; }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
.btn .plus { display: none; }

/* ---------- Hero shelf ---------- */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr); gap: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 20px 40px -28px var(--shadow-2); outline: 1px solid var(--gold-soft); outline-offset: -9px; padding: 26px; margin-bottom: 26px; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 22px 20px; } }
.goal { display: grid; align-content: start; gap: 6px; }
.eyebrow { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin: 0; }
.eyebrow::before { content: '✦ '; color: var(--gold); }
.goal-num { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 3.8rem; line-height: 0.95; margin: 4px 0 0; font-variant-numeric: lining-nums tabular-nums; }
.goal-num small { font-size: 1.5rem; font-weight: 400; color: var(--gold); }
.goal-sub { margin: 0; color: var(--muted); }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .6s ease; }
.pace { justify-self: start; margin-top: 6px; font-family: var(--serif); font-style: italic; font-size: 0.95rem; color: var(--fg); }
.pace::before { content: '✦ '; color: var(--gold); font-style: normal; }
.pace.ahead { color: var(--accent); }
.pace.behind { color: var(--rose); }
.goal-edit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.goal-edit .field { width: 84px; }

.shelf-wrap { position: relative; min-width: 0; display: grid; gap: 8px; }
.shelf { display: flex; align-items: flex-end; gap: 3px; overflow-x: auto; padding: 30px 10px 0; min-height: 200px; scrollbar-width: thin; }
.plank { height: 14px; border-radius: 3px; border-top: 2px solid var(--gold); background: linear-gradient(var(--wood) 0 60%, var(--wood-dark) 60%); box-shadow: 0 10px 18px -10px var(--shadow-2); }
.spine { flex: none; position: relative; border-radius: 4px 4px 1px 1px; background: var(--c); color: var(--t); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: inset -3px 0 0 rgba(0,0,0,.18), inset 2px 0 0 rgba(255,255,255,.12); transition: transform .35s cubic-bezier(.3,1.5,.5,1); transform-origin: bottom center; }
.spine::before, .spine::after { content: ''; position: absolute; left: 4px; right: 4px; height: 2px; background: var(--foil); border-top: 1px solid var(--foil); background-clip: content-box; padding-top: 2px; opacity: .9; }
.spine::before { top: 9px; }
.spine::after { bottom: 9px; }
.spine span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--serif); font-style: italic; font-size: 0.72rem; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: calc(100% - 32px); }
.spine:hover { transform: translateY(-10px); }
.spine.lean { transform: rotate(7deg); margin-left: 7px; margin-right: 12px; }
.spine.lean:hover { transform: rotate(7deg) translateY(-10px); }
.spine.ghost { background: transparent; border: 1px dashed var(--line); box-shadow: none; }
.spine.ghost::before, .spine.ghost::after { display: none; }
.spine.ghost:hover { transform: none; }
.moon { flex: none; align-self: flex-end; width: 38px; height: 38px; border-radius: 50%; margin: 0 0 40px 14px; box-shadow: inset -10px 4px 0 0 var(--gold); transform: rotate(-20deg); }
.twinkle { position: absolute; color: var(--gold); font-size: 0.9rem; line-height: 1; pointer-events: none; animation: twinkle 3.2s ease-in-out infinite; }
.twinkle.t1 { top: 2px; right: 22%; }
.twinkle.t2 { top: 18px; right: 8%; font-size: 0.6rem; animation-delay: 1.1s; }
.twinkle.t3 { top: 0; right: 42%; font-size: 0.55rem; animation-delay: 2s; }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
.shelf-note { margin: 0; font-size: 0.8rem; color: var(--muted); font-family: var(--serif); font-style: italic; }

/* ---------- Tabs ---------- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; margin-bottom: 18px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-radius: 999px; padding: 8px 14px; font-family: var(--serif); font-weight: 500; font-size: 1.05rem; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; transition: color .2s ease, background .2s ease; }
.tab:hover { color: var(--fg); }
.tab[aria-pressed="true"] { color: var(--fg); font-style: italic; background: var(--surface); box-shadow: 0 1px 2px var(--shadow), inset 0 0 0 1px var(--gold-soft); }
.tab[aria-pressed="true"]::before { content: '✦'; color: var(--gold); font-style: normal; font-size: 0.75em; }
.count { font-family: var(--body); font-style: normal; font-size: 0.7rem; font-weight: 700; background: var(--lavender); color: var(--tint-ink); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; background: var(--surface); border: 1px dashed var(--gold-soft); border-radius: 16px; padding: 11px 16px; margin-bottom: 20px; font-size: 0.88rem; }
.banner p { margin: 0; font-family: var(--serif); font-style: italic; }

/* ---------- Toolbars ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 26px; }
.toolbar.between { justify-content: space-between; }
.lede { margin: 0; color: var(--muted); font-size: 0.98rem; max-width: 62ch; font-family: var(--serif); font-style: italic; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; font-size: 0.9rem; min-width: 0; transition: border-color .15s ease, box-shadow .15s ease; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
.field.sm { padding: 5px 9px; font-size: 0.8rem; border-radius: 9px; }
#lib-q { flex: 1 1 220px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Library grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 38px 24px; }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 14px; } }
.book { position: relative; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.book h3, .tr h3 { font-family: var(--serif); font-weight: 600; font-size: 1.08rem; line-height: 1.2; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.author { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; font-style: italic; font-family: var(--serif); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em; background: var(--chip, var(--lavender)); color: var(--tint-ink); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
.chip.plain { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.date { margin: 0; font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.reason { margin: 0; font-family: var(--serif); font-style: italic; font-size: 0.86rem; color: var(--fg); border-left: 2px solid var(--gold); padding-left: 10px; }

/* ---------- Covers (clothbound, gold-foil frame) ---------- */
.cover { --c: #1F5E4E; --t: #F6EFE2; position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 3px 9px 9px 3px; background: var(--c); color: var(--t); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 16px 16px 24px; box-shadow: 0 1px 1px var(--shadow), 0 16px 26px -16px var(--shadow-2); transition: transform .4s cubic-bezier(.3,1.4,.5,1), box-shadow .3s ease; }
.cover::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 90%), linear-gradient(90deg, transparent 8px, rgba(255,255,255,.18) 8px 9px, transparent 9px); }
.cover::after { content: ''; position: absolute; inset: 9px 9px 9px 17px; border: 1px solid var(--foil); border-radius: 2px; opacity: .75; box-shadow: inset 0 0 0 3px var(--c), inset 0 0 0 4px var(--foil); }
.grid > .book:hover .cover { transform: translateY(-6px) rotate(-1.2deg); box-shadow: 0 2px 2px var(--shadow), 0 26px 32px -18px var(--shadow-2); }
.cv-title { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.15rem; line-height: 1.12; text-wrap: balance; overflow-wrap: anywhere; position: relative; z-index: 1; }
.cv-author { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: var(--foil); position: relative; z-index: 1; }
.cv-author::before { content: '✦'; display: block; margin-bottom: 6px; font-size: 0.8rem; letter-spacing: 0; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
.cover img.ol { opacity: 0; transition: opacity .4s ease; }
.cover img.ol.ok { opacity: 1; }
.fave { position: absolute; top: -12px; right: -10px; z-index: 3; width: 58px; height: 58px; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; text-align: center; font-family: var(--serif); font-style: italic; font-size: 0.74rem; line-height: 1.05; transform: rotate(12deg); box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 0 4px var(--on-gold), 0 6px 12px -6px var(--shadow-2); }
.cover.sm { width: 54px; flex: none; padding: 7px 5px 6px 10px; border-radius: 2px 5px 5px 2px; }
.cover.sm::before { width: 5px; }
.cover.sm::after { inset: 4px 4px 4px 8px; box-shadow: none; }
.cover.sm .cv-title { font-size: 0.5rem; }
.cover.sm .cv-author { display: none; }

/* ---------- Stars ---------- */
.stars { display: flex; }
.star { background: none; border: 0; padding: 1px 2px 1px 0; font-size: 1.3rem; line-height: 1; color: var(--star-off); transition: transform .2s ease, color .2s ease; }
button.star:hover { transform: scale(1.2); color: var(--gold-soft); }
.star.on { color: var(--star); }
.star.pop { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.7) rotate(-20deg); } 60% { transform: scale(1.4) rotate(10deg); } 100% { transform: scale(1); } }

/* ---------- Inline confirm ---------- */
.confirm { position: absolute; inset: -8px; background: var(--overlay); border: 1px solid var(--gold-soft); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding: 12px; text-align: center; z-index: 4; box-shadow: 0 16px 30px -16px var(--shadow-2); }
.confirm p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1rem; }

/* ---------- To Read (index cards) ---------- */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.tr { position: relative; display: grid; grid-template-columns: 48px 54px minmax(0, 1fr) auto; gap: 16px; align-items: center; background: repeating-linear-gradient(var(--surface) 0 25px, var(--hair) 25px 26px); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px 14px 14px; box-shadow: 0 10px 22px -18px var(--shadow-2); }
.pos { font-family: var(--serif); font-style: italic; font-size: 2rem; line-height: 1; text-align: center; color: var(--gold); font-variant-numeric: lining-nums; }
.pos small { display: block; font-size: 0.62rem; font-style: normal; font-family: var(--body); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.tr-main { display: grid; gap: 4px; min-width: 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
@media (max-width: 640px) {
  .tr { grid-template-columns: 38px 48px minmax(0, 1fr); gap: 10px 12px; }
  .tr .cover.sm { width: 48px; }
  .pos { font-size: 1.6rem; }
  .controls { grid-column: 1 / -1; justify-content: flex-start; }
}
.prio { display: inline-flex; align-items: center; gap: 6px; }
.prio::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--lo); box-shadow: 0 0 0 3px var(--surface-2); }
.prio[data-p="high"]::before { background: var(--hi); }
.prio[data-p="medium"]::before { background: var(--med); }

/* ---------- Stats ---------- */
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.seg button { background: none; border: 0; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: 0.83rem; color: var(--muted); transition: background .15s ease, color .15s ease; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px var(--shadow-2); }
.custom { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.custom label { display: grid; gap: 3px; font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.range-label { margin: 20px 0 0; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; }
.range-label::before { content: '✦ '; color: var(--gold); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-block: 12px 30px; }
@media (max-width: 680px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { position: relative; background: var(--tile); color: var(--tint-ink); border-radius: 22px; padding: 16px 18px; display: grid; gap: 2px; overflow: hidden; }
.tile::after { content: '✦'; position: absolute; top: 12px; right: 14px; color: var(--tint-ink); opacity: .35; font-size: 0.9rem; }
.tile:nth-child(1) { --tile: var(--blush); }

    if (e && e.clientX) return [e.clientX, e.clientY];

  }

  /* ---------- Pieces ---------- */
  function coverColor(s) { return COVER_COLORS[hash(s) % COVER_COLORS.length]; }
  function genreColor(g) { return STICKERS[hash(g || 'Other') % STICKERS.length]; }
  function cover(b, cls) {
    cls = cls || '';
    if (b.img) return '<div class="cover ' + cls + '"><img src="' + b.img + '" alt="Cover of ' + esc(b.title) + '"></div>';
    var c = coverColor(b.title), isbn = isbnFor(b);
    // Real cover from Open Library when the book has an ISBN; the designed cover stays underneath as the fallback
    var src = b.coverUrl || (isbn ? 'https://covers.openlibrary.org/b/isbn/' + isbn + '-M.jpg?default=false' : '');
    var real = src ? '<img class="ol" src="' + esc(src) + '" alt="" loading="lazy">' : '';
    return '<div class="cover ' + cls + '" style="--c:' + c[0] + ';--t:' + c[1] + '" aria-hidden="true"><span class="cv-title">' + esc(b.title) + '</span><span class="cv-author">' + esc(b.author) + '</span>' + real + '</div>';
  }
  function isbnFor(b) {
    if (b.isbn) return b.isbn;
    var hit = CATALOG.filter(function (c) { return c.title === b.title; })[0];
    return hit && hit.isbn ? hit.isbn : '';
  }
  function starsHtml(r, interactive) {
    var s = '';
    for (var i = 1; i <= 5; i++) {
      if (interactive) s += '<button class="star' + (i <= r ? ' on' : '') + '" data-action="rate" data-v="' + i + '" aria-label="Rate ' + i + ' star' + (i > 1 ? 's' : '') + '" aria-pressed="' + (i === r) + '">★</button>';
      else s += '<span class="star' + (i <= r ? ' on' : '') + '" aria-hidden="true">★</span>';
    }
    return '<div class="stars"' + (interactive ? ' role="group" aria-label="Your rating"' : ' role="img" aria-label="' + r + ' of 5 stars"') + '>' + s + '</div>';
  }
  function chips(b) { return '<div class="chips"><span class="chip" style="--chip:' + genreColor(b.genre) + '">' + esc(b.genre) + '</span>' + (b.pages ? '<span class="chip plain">' + fmtN(b.pages) + ' pages</span>' : '') + '</div>'; }
  function confirmBox(msg) { return '<div class="confirm" role="alertdialog" aria-label="' + esc(msg) + '"><p>' + esc(msg) + '</p><div class="actions"><button class="btn sm danger" data-action="del-yes">Remove</button><button class="btn sm" data-action="del-no">Keep</button></div></div>'; }
  function empty(h, p, btn) { return '<div class="empty">' + BOOK_SVG + '<h3>' + h + '</h3><p>' + p + '</p>' + (btn || '') + '</div>'; }

  /* ---------- Hero shelf ---------- */
  function heroHtml() {
    var y = new Date().getFullYear();
    var year = data.library.filter(function (b) { return b.dateRead && b.dateRead.slice(0, 4) === String(y); })
      .sort(function (a, b) { return a.dateRead.localeCompare(b.dateRead); });
    var n = year.length, goal = data.goal, pages = year.reduce(function (s, b) { return s + (b.pages || 0); }, 0);
    var jan1 = new Date(y, 0, 1), days = (y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0)) ? 366 : 365;
    var dayOfYear = Math.floor((startOfToday() - jan1) / 86400000) + 1;
    var diff = n - goal * dayOfYear / days, pace, paceCls = '';
    if (n >= goal) { pace = 'Goal reached. Bravo!'; paceCls = 'ahead'; }
    else if (Math.abs(diff) < 0.5) pace = 'Right on pace';
    else if (diff > 0) { pace = plural(Math.round(diff), 'book') + ' ahead of pace'; paceCls = 'ahead'; }
    else { pace = plural(Math.round(-diff), 'book') + ' behind pace'; paceCls = 'behind'; }

    var spines = year.map(function (b, i) {
      var c = b.img ? ['#2A2140', '#F2E5BD'] : coverColor(b.title);

      return '<span class="spine' + lean + '" style="--c:' + c[0] + ';--t:' + c[1] + ';height:' + h + 'px;width:' + w + 'px" title="' + esc(b.title + ' · ' + b.author) + '" role="img" aria-label="' + esc(b.title) + '"><span>' + esc(b.title) + '</span></span>';
    }).join('');
    var ghosts = '';
    for (var g = n; g < Math.min(goal, n + 30); g++) ghosts += '<span class="spine ghost" style="height:' + (120 + (g * 37) % 40) + 'px;width:' + (26 + (g * 13) % 14) + 'px" aria-hidden="true"></span>';

    var edit = state.editGoal
      ? '<form class="goal-edit" id="goal-form"><label class="sr" for="goal-input">Books goal for ' + y + '</label><input class="field" id="goal-input" type="number" min="1" max="365" value="' + goal + '"><button class="btn sm primary" type="submit">Save goal</button><button class="btn sm ghost" type="button" data-action="goal-cancel">Cancel</button></form>'
      : '<div class="goal-edit"><button class="btn sm" data-action="goal-edit">Change goal</button></div>';

    return '<div class="goal"><p class="eyebrow">Your ' + y + ' shelf</p>'
      + '<p class="goal-num">' + n + '<small> / ' + goal + '</small></p>'
      + '<p class="goal-sub">books read · ' + fmtN(pages) + ' pages</p>'
      + '<div class="meter" role="progressbar" aria-label="Reading goal progress" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + n + '"><i style="width:' + Math.min(100, (n / goal) * 100) + '%"></i></div>'
      + '<span class="pace ' + paceCls + '">' + pace + '</span>' + edit + '</div>'
      + '<div class="shelf-wrap"><span class="twinkle t1" aria-hidden="true">✦</span><span class="twinkle t2" aria-hidden="true">✦</span><span class="twinkle t3" aria-hidden="true">✧</span><div class="shelf">' + spines + ghosts + '<span class="moon" aria-hidden="true"></span></div><div class="plank" aria-hidden="true"></div>'
      + '<p class="shelf-note">' + (n ? 'Each spine is a book you finished this year. Thicker spines, longer books.' : 'Finish a book and its spine lands here.') + (goal > n ? ' Dashed slots are left to fill.' : '') + '</p></div>';
  }

  /* ---------- Library ---------- */
  function viewLibrary() {
    if (!data.library.length) return empty('Your shelf is empty', 'Add the books you have finished. Rate them, share them, and watch your totals add up in Stats.', '<button class="btn hot" data-action="add" data-dest="library">Add a book</button>');
    var genres = Array.from(new Set(data.library.map(function (b) { return b.genre; }))).sort();
    if (state.genre !== 'all' && genres.indexOf(state.genre) < 0) state.genre = 'all';
    var sorts = [['recent', 'Recently finished'], ['rating', 'Highest rated'], ['title', 'Title A–Z']];
    return '<div class="toolbar">'
      + '<label class="sr" for="lib-q">Search your library</label><input class="field" id="lib-q" type="search" placeholder="Search title or author" value="' + esc(state.q) + '">'
      + '<label class="sr" for="lib-genre">Genre</label><select class="field" id="lib-genre"><option value="all">All genres</option>' + genres.map(function (g) { return '<option value="' + esc(g) + '"' + (g === state.genre ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select>'
      + '<label class="sr" for="lib-sort">Sort</label><select class="field" id="lib-sort">' + sorts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === state.sort ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>'
      + '</div><div id="lib-grid">' + libGrid() + '</div>';
  }
  function libGrid() {
    var q = state.q.trim().toLowerCase();
    var list = data.library.filter(function (b) {
      return (state.genre === 'all' || b.genre === state.genre) && (!q || (b.title + ' ' + b.author).toLowerCase().indexOf(q) > -1);
    });
    list.sort(function (a, b) {
      if (state.sort === 'title') return a.title.localeCompare(b.title);
      if (state.sort === 'rating' && b.rating !== a.rating) return b.rating - a.rating;
      return (b.dateRead || '').localeCompare(a.dateRead || '');
    });
    if (!list.length) return '<p class="none">No books match that search.</p>';

  }
  function bookCard(b) {
    return '<article class="book" data-id="' + b.id + '" data-list="library">'
      + (b.rating === 5 ? '<span class="fave" aria-label="Favorite">Beloved</span>' : '')
      + cover(b)
      + '<div><h3>' + esc(b.title) + '</h3><p class="author">' + esc(b.author) + '</p></div>'
      + chips(b) + starsHtml(b.rating || 0, true)
      + '<p class="date">' + (b.dateRead ? 'Finished ' + fmtDate(b.dateRead) : 'No finish date') + '</p>'
      + '<div class="actions"><button class="btn sm" data-action="share-book">Share</button><button class="btn sm ghost" data-action="ask-delete">Remove</button></div>'
      + (state.confirm === b.id ? confirmBox('Remove this book from your library?') : '')

  }

  /* ---------- To Read ---------- */
  function viewToRead() {
    if (!data.toread.length) return empty('Nothing on deck', 'Add books you are considering. Rank them by priority, and move each one to your library when you finish it.', '<button class="btn hot" data-action="add" data-dest="toread">Add to To Read</button>');

      + '<div class="actions"><button class="btn sm" data-action="sort-priority">Sort by priority</button><button class="btn sm hot" data-action="add" data-dest="toread">Add to list</button></div></div>'
      + '<ol class="list">' + data.toread.map(trItem).join('') + '</ol>';
  }
  function trItem(b, i) {
    var n = data.toread.length;
    return '<li class="tr" data-id="' + b.id + '" data-list="toread"><span class="pos"><small>No.</small>' + (i + 1) + '</span>' + cover(b, 'sm')
      + '<div class="tr-main"><h3>' + esc(b.title) + '</h3><p class="author">' + esc(b.author) + '</p>' + chips(b) + '</div>'
      + '<div class="controls"><label class="prio" data-p="' + b.priority + '"><span class="sr">Priority for ' + esc(b.title) + '</span><select class="field sm" id="prio-' + b.id + '" data-change="priority">'
      + ['high', 'medium', 'low'].map(function (p) { return '<option value="' + p + '"' + (p === b.priority ? ' selected' : '') + '>' + cap(p) + '</option>'; }).join('') + '</select></label>'
      + '<button class="btn sm icon" data-action="up" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button>'
      + '<button class="btn sm icon" data-action="down" aria-label="Move down"' + (i === n - 1 ? ' disabled' : '') + '>↓</button>'

      + '<button class="btn sm ghost" data-action="ask-delete">Remove</button></div>'

      + '</li>';
  }

  /* ---------- For You ---------- */
  function recommend() {
    var owned = {};
    data.library.concat(data.toread).forEach(function (b) { owned[b.title.toLowerCase()] = 1; });
    var rated = data.library.filter(function (b) { return b.rating > 0; });
    var out = [];
    CATALOG.forEach(function (c) {
      if (owned[c.title.toLowerCase()]) return;
      var score = 0, best = null, bestW = 0, kind = '';
      rated.forEach(function (b) {
        var w = b.rating - 2.5;
        if (b.author === c.author) { score += w * 2; if (w * 2 > bestW) { bestW = w * 2; best = b; kind = 'author'; } }
        else if (b.genre === c.genre) { score += w; if (w > bestW) { bestW = w; best = b; kind = 'genre'; } }
      });
      if (score > 0 && best) out.push({ book: c, score: score, reason: kind === 'author' ? 'More from ' + c.author + '. You gave ' + best.title + ' ' + best.rating + '★.' : 'Because you gave ' + best.title + ' ' + best.rating + '★.' });
    });

  }
  function viewRecs() {
    if (!data.library.some(function (b) { return b.rating > 0; })) return empty('Rate a few books first', 'Picks come from your star ratings. Rate books in your library and they will show up here.', '<button class="btn primary" data-action="tab" data-tab="library">Go to Library</button>');
    var recs = recommend();
    if (!recs.length) return empty('No new picks right now', 'You already own or saved every match in the catalog. Rate more books to widen the net.', '');
    return '<div class="toolbar"><p class="lede">Hand-picked from your ratings. Books you gave 3★ or more pull similar titles in, 1★ and 2★ push them out, and the same author counts double.</p></div>'
      + '<div class="grid">' + recs.map(function (r) {
        var b = r.book;
        return '<article class="book" data-title="' + esc(b.title) + '">' + cover(b)
          + '<div><h3>' + esc(b.title) + '</h3><p class="author">' + esc(b.author) + '</p></div>'
          + chips(b) + '<p class="reason">' + esc(r.reason) + '</p>'
          + '<div class="actions"><button class="btn sm primary" data-action="rec-want">Want to read</button><button class="btn sm" data-action="rec-read">I read it</button></div></article>';
      }).join('') + '</div>';
  }

  /* ---------- Stats ---------- */
  var RANGES = [['month', 'This month'], ['30', 'Last 30 days'], ['year', 'This year'], ['365', 'Last 12 months'], ['all', 'All time'], ['custom', 'Custom']];
  function bounds() {
    var t = startOfToday(), to = new Date(t), from = null;
    to.setHours(23, 59, 59, 999);
    if (state.range === 'month') from = new Date(t.getFullYear(), t.getMonth(), 1);
    else if (state.range === '30') { from = new Date(t); from.setDate(from.getDate() - 29); }
    else if (state.range === 'year') from = new Date(t.getFullYear(), 0, 1);
    else if (state.range === '365') { from = new Date(t); from.setDate(from.getDate() - 364); }
    else if (state.range === 'custom') {
      if (state.from) from = parse(state.from);
      if (state.to) { to = parse(state.to); to.setHours(23, 59, 59, 999); }
    } else to = null;
    return { from: from, to: to };
  }
  function booksInRange(list) {
    var r = bounds();
    return list.filter(function (b) {
      if (!b.dateRead) return state.range === 'all';
      var d = parse(b.dateRead);
      return (!r.from || d >= r.from) && (!r.to || d <= r.to);
    });
  }
  function rangePhrase() {
    var r = bounds();
    switch (state.range) {
      case 'month': return 'this month';
      case '30': return 'in the last 30 days';
      case 'year': return 'in ' + new Date().getFullYear();
      case '365': return 'in the last 12 months';
      case 'all': return 'so far';
      default: return (r.from ? 'from ' + fmtD(r.from) + ' ' : '') + 'through ' + fmtD(r.to);
    }
  }
  function rangeLabel() {
    if (state.range === 'all') return 'All time';
    var r = bounds();
    return (r.from ? fmtD(r.from) : 'Start') + ' to ' + fmtD(r.to);
  }
  function crunch(list) {
    var pages = list.reduce(function (s, b) { return s + (b.pages || 0); }, 0);
    var rated = list.filter(function (b) { return b.rating > 0; });
    var avg = rated.length ? rated.reduce(function (s, b) { return s + b.rating; }, 0) / rated.length : 0;
    function group(key) {
      var m = {};
      list.forEach(function (b) { var k = b[key] || 'Other'; m[k] = m[k] || { name: k, books: 0, pages: 0 }; m[k].books++; m[k].pages += b.pages || 0; });
      return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b[state.metric] - a[state.metric] || a.name.localeCompare(b.name); });
    }
    return { books: list.length, pages: pages, avg: avg, rated: rated.length, avgLen: list.length ? Math.round(pages / list.length) : 0, genres: group('genre'), authors: group('author') };
  }
  function bars(groups, limit) {
    if (!groups.length) return '<p class="none">No books in this timeframe.</p>';
    var g = groups.slice(0, limit), max = Math.max.apply(null, g.map(function (x) { return x[state.metric]; })) || 1;
    return g.map(function (x) {
      var v = x[state.metric];
      return '<div class="bar-row"><span class="bar-label">' + esc(x.name) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(4, (v / max) * 100) + '%"></div></div><span class="bar-val">' + fmtN(v) + '</span></div>';
    }).join('');
  }
  function viewStats() {
    var list = booksInRange(data.library), s = crunch(list);
    var html = '<div class="seg" role="group" aria-label="Timeframe">' + RANGES.map(function (r) { return '<button data-action="range" data-v="' + r[0] + '" aria-pressed="' + (state.range === r[0]) + '">' + r[1] + '</button>'; }).join('') + '</div>';
    if (state.range === 'custom') {
      html += '<div class="custom"><label for="stat-from">From<input class="field" type="date" id="stat-from" data-change="range-date" value="' + esc(state.from) + '"></label><label for="stat-to">To<input class="field" type="date" id="stat-to" data-change="range-date" value="' + esc(state.to) + '"></label></div>';
    }
    html += '<p class="range-label">' + esc(rangeLabel()) + '</p>';
    html += '<div class="tiles">'
      + '<div class="tile"><span class="k">Books read</span><span class="v">' + fmtN(s.books) + '</span><span class="s">' + (s.books ? 'finished ' + rangePhrase() : 'none yet') + '</span></div>'
      + '<div class="tile"><span class="k">Pages read</span><span class="v">' + fmtN(s.pages) + '</span><span class="s">' + (s.books ? 'about ' + fmtN(s.avgLen) + ' per book' : '&nbsp;') + '</span></div>'
      + '<div class="tile"><span class="k">Avg rating</span><span class="v">' + (s.rated ? s.avg.toFixed(1) : '–') + '</span>' + (s.rated ? starsHtml(Math.round(s.avg), false) : '<span class="s">no ratings</span>') + '</div>'
      + '<div class="tile"><span class="k">Top genre</span><span class="v word">' + (s.genres[0] ? esc(s.genres[0].name) : '–') + '</span><span class="s">' + (s.genres[0] ? plural(s.genres[0].books, 'book') : '&nbsp;') + '</span></div>'
      + '</div>';
    html += '<div class="panels-head"><h2>The breakdown</h2><div class="seg" role="group" aria-label="Measure"><button data-action="metric" data-v="books" aria-pressed="' + (state.metric === 'books') + '">Books</button><button data-action="metric" data-v="pages" aria-pressed="' + (state.metric === 'pages') + '">Pages</button></div></div>';
    html += '<div class="panels"><section class="panel"><h3>By genre</h3>' + bars(s.genres, 10) + '</section><section class="panel authors"><h3>By author</h3>' + bars(s.authors, 8) + '</section></div>';
    if (list.length) {
      var rows = list.slice().sort(function (a, b) { return (b.dateRead || '').localeCompare(a.dateRead || ''); }).map(function (b) {
        return '<tr><td>' + esc(b.title) + '</td><td>' + esc(b.author) + '</td><td>' + esc(b.genre) + '</td><td class="n">' + fmtN(b.pages) + '</td><td class="n">' + (b.dateRead ? fmtDate(b.dateRead) : '–') + '</td><td>' + (b.rating ? starsHtml(b.rating, false) : '–') + '</td></tr>';
      }).join('');
      html += '<section class="panel" style="margin-bottom:20px"><h3>Books in this timeframe</h3><div class="tbl"><table><thead><tr><th>Title</th><th>Author</th><th>Genre</th><th class="n">Pages</th><th class="n">Finished</th><th>Rating</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
    }
    html += '<div class="stats-foot"><button class="btn hot" data-action="share-stats"' + (s.books ? '' : ' disabled') + '>Share these stats</button></div>';
    return html;
  }

  /* ---------- Shell ---------- */

  /* ---------- Toast ---------- */

  var ICONS = {

    type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>'
  };
  function methodPanel() {
    if (state.method === 'scan') return '<div class="note"><p>Point your camera at the barcode on the back cover, or type the 13-digit ISBN printed under it.</p>'
      + '<button type="button" class="btn primary" data-action="scan" id="scan-btn" style="justify-self:start">Start camera</button><div id="reader" class="reader" hidden></div>'
      + '<div class="inline"><label class="sr" for="isbn">ISBN</label><input class="field" id="isbn" inputmode="numeric" autocomplete="off" placeholder="978…"><button type="button" class="btn" data-action="lookup">Look up</button></div>'
      + '<p class="status" id="lookup-msg" role="status"></p></div>';
    if (state.method === 'photo') return '<div class="note"><label class="btn" for="cover-file" style="justify-self:start">Take or choose a cover photo</label><input class="sr" type="file" id="cover-file" accept="image/*" capture="environment">'
      + '<div class="preview" id="cover-preview"></div><p class="hint">The photo becomes this book\'s cover. Add the title and author below.</p></div>';
    return '';
  }
  function openAdd(dest) {
    state.method = dest === 'toread' ? 'type' : 'scan';
    state.isbn = ''; state.coverUrl = '';
    pendingImg = null;
    var gl = GENRES.map(function (g) { return '<option value="' + esc(g) + '"></option>'; }).join('');
    openModal('<div class="sheet-h"><h2 id="sheet-title">Add a book</h2><button class="x" data-action="close-modal" aria-label="Close">×</button></div>'
      + '<div class="methods" role="group" aria-label="How to add">'
      + ['scan', 'photo', 'type'].map(function (m) { return '<button type="button" class="method" data-action="method" data-m="' + m + '" aria-pressed="' + (state.method === m) + '">' + ICONS[m] + (m === 'scan' ? 'Scan barcode' : m === 'photo' ? 'Cover photo' : 'Type it in') + '</button>'; }).join('')
      + '</div><div id="method-panel">' + methodPanel() + '</div>'
      + '<form class="form" id="add-form" novalidate>'
      + '<label for="f-title">Title<input class="field" id="f-title" autocomplete="off"></label>'
      + '<label for="f-author">Author<input class="field" id="f-author" autocomplete="off"></label>'
      + '<div class="two"><label for="f-genre">Genre<input class="field" id="f-genre" list="genre-list" placeholder="Fiction"><datalist id="genre-list">' + gl + '</datalist></label>'
      + '<label for="f-pages">Pages<input class="field" id="f-pages" type="number" min="0" inputmode="numeric"></label></div>'
      + '<fieldset><legend>Put it in</legend><div class="radios"><label><input type="radio" name="dest" id="dest-library" value="library"' + (dest !== 'toread' ? ' checked' : '') + '> Library (read it)</label><label><input type="radio" name="dest" id="dest-toread" value="toread"' + (dest === 'toread' ? ' checked' : '') + '> To Read</label></div></fieldset>'
      + '<div class="two" id="lib-fields"' + (dest === 'toread' ? ' hidden' : '') + '><label for="f-date">Finished on<input class="field" id="f-date" type="date" value="' + iso(new Date()) + '"></label>'
      + '<label for="f-rating">Your rating<select class="field" id="f-rating"><option value="0">Not rated</option>' + [5, 4, 3, 2, 1].map(function (n) { return '<option value="' + n + '">' + stars(n) + '</option>'; }).join('') + '</select></label></div>'
      + '<div id="tr-fields"' + (dest === 'toread' ? '' : ' hidden') + '><label for="f-prio">Priority<select class="field" id="f-prio"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label></div>'
      + '<p class="err" id="add-err" role="alert"></p>'
      + '<button type="submit" class="btn hot" id="add-submit">' + (dest === 'toread' ? 'Add to To Read' : 'Add to Library') + '</button>'
      + '</form>');
  }
  function fetchJSON(url) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 8000) : null;
    return fetch(url, ctl ? { signal: ctl.signal } : {}).then(
      function (r) { clearTimeout(timer); return r.ok ? r.json() : null; },
      function (e) { clearTimeout(timer); throw e; });
  }
  var GENRE_RULES = [['science fiction', 'Science Fiction'], ['sci-fi', 'Science Fiction'], ['fantasy', 'Fantasy'], ['mystery', 'Mystery'], ['detective', 'Mystery'], ['thriller', 'Thriller'], ['suspense', 'Thriller'], ['romance', 'Romance'], ['western', 'Western'], ['historical', 'Historical'], ['memoir', 'Memoir'], ['autobiography', 'Memoir'], ['biography', 'Biography'], ['self-help', 'Self-Help'], ['self help', 'Self-Help'], ['business', 'Business'], ['economics', 'Business'], ['religion', 'Faith'], ['christian', 'Faith'], ['bible', 'Faith'], ['poetry', 'Poetry'], ['history', 'History'], ['fiction', 'Fiction']];
  function mapGenre(list) {
    var text = (list || []).join(' | ').toLowerCase();
    for (var i = 0; i < GENRE_RULES.length; i++) if (text.indexOf(GENRE_RULES[i][0]) > -1) return GENRE_RULES[i][1];
    return '';
  }
  function fromGoogle(v) {
    return fetchJSON('https://www.googleapis.com/books/v1/volumes?q=isbn:' + v).then(function (d) {
      var vi = d && d.items && d.items[0] && d.items[0].volumeInfo;
      if (!vi || !vi.title) return null;
      var img = vi.imageLinks && (vi.imageLinks.thumbnail || vi.imageLinks.smallThumbnail);
      return { title: vi.title, author: (vi.authors || []).join(', '), pages: vi.pageCount || '', genre: mapGenre(vi.categories), coverUrl: img ? img.replace(/^http:/, 'https:').replace('&edge=curl', '') : '' };
    });
  }
  function fromOpenLibrary(v) {
    return fetchJSON('https://openlibrary.org/api/books?bibkeys=ISBN:' + v + '&format=json&jscmd=data').then(function (d) {
      var b = d && d['ISBN:' + v];
      if (!b || !b.title) return null;
      return { title: b.title, author: (b.authors || []).map(function (a) { return a.name; }).join(', '), pages: b.number_of_pages || '', genre: mapGenre((b.subjects || []).map(function (x) { return x.name; })), coverUrl: b.cover ? (b.cover.medium || b.cover.large || '') : '' };
    });
  }
  function fillForm(b) {
    $('#f-title').value = b.title || '';
    $('#f-author').value = b.author || '';
    if (b.genre) $('#f-genre').value = b.genre;
    if (b.pages) $('#f-pages').value = b.pages;
  }
  function lookup() {
    var input = $('#isbn'), msg = $('#lookup-msg');
    var v = ((input && input.value) || '').replace(/[^0-9Xx]/g, '').toUpperCase();
    if (v.length !== 10 && v.length !== 13) { msg.textContent = 'ISBNs have 10 or 13 digits. Check the number under the barcode.'; return; }
    state.isbn = v; state.coverUrl = '';
    var local = CATALOG.filter(function (c) { return c.isbn === v; })[0];
    if (local) { fillForm(local); msg.textContent = 'Found it! ' + local.title + ' by ' + local.author + '. Check the details and save.'; return; }
    msg.textContent = 'Looking up ' + v + '…';
    fromGoogle(v).catch(function () { return null; })
      .then(function (b) { return b || fromOpenLibrary(v); })
      .then(function (b) {
        if (!document.body.contains(msg)) return;
        if (b) {
          fillForm(b); state.coverUrl = b.coverUrl || '';
          msg.textContent = 'Found it! ' + b.title + (b.author ? ' by ' + b.author : '') + '. Check the details and save.';
        } else {
          msg.textContent = 'No match for ' + v + '. Type the details below.';
          $('#f-title').focus();
        }
      })
      .catch(function () { if (document.body.contains(msg)) msg.textContent = 'Could not reach the book database. Check your connection, or type the details below.'; });
  }

  /* ---------- Live barcode scanner ---------- */
  var scanner = null;
  function startScan() {
    var msg = $('#lookup-msg'), reader = $('#reader'), btn = $('#scan-btn');
    if (typeof window.Html5Qrcode === 'undefined') { msg.textContent = 'The scanner is still loading. Try again in a moment, or type the ISBN.'; return; }
    reader.hidden = false; btn.textContent = 'Stop camera'; msg.textContent = 'Hold the barcode inside the box.';
    var F = window.Html5QrcodeSupportedFormats, cfg = { verbose: false };
    if (F) cfg.formatsToSupport = [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E];
    try { scanner = new window.Html5Qrcode('reader', cfg); }
    catch (e) { stopScan(); msg.textContent = 'The scanner could not start. Type the ISBN instead.'; return; }
    scanner.start(
      { facingMode: 'environment' },
      { fps: 12, qrbox: function (w, h) { return { width: Math.round(Math.min(w * 0.85, 320)), height: Math.round(Math.max(60, Math.min(h * 0.45, 150))) }; } },
      function (text) { stopScan(); $('#isbn').value = text; if (navigator.vibrate) navigator.vibrate(40); lookup(); },
      function () {}
    ).catch(function () {
      stopScan();
      msg.textContent = 'Camera unavailable. Allow camera access for this site (on iPhone: Settings › Safari › Camera), then try again, or type the ISBN.';
    });
  }
  function stopScan() {
    var s = scanner; scanner = null;
    if (s) { try { s.stop().then(function () { try { s.clear(); } catch (e) {} }, function () {}); } catch (e) {} }
    var r = $('#reader'); if (r) r.hidden = true;
    var b = $('#scan-btn'); if (b) b.textContent = 'Start camera';
  }

  /* ---------- Backup ---------- */
  function exportBackup() {
    var payload = { app: 'read-between', version: 1, exported: new Date().toISOString(), goal: data.goal, library: data.library, toread: data.toread };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'read-between-backup-' + iso(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('Backup saved');
  }
  function importBackup(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.library) || !Array.isArray(d.toread)) throw new Error('bad');
        var prev = JSON.stringify(data);
        data = { library: d.library, toread: d.toread, goal: d.goal || data.goal };
        save(); state.confirm = null; render();
        toast('Backup restored: ' + plural(data.library.length, 'book'), function () { data = JSON.parse(prev); save(); render(); });
      } catch (e) { toast('That file is not a Read Between backup.'); }
      input.value = '';
    };
    r.readAsText(file);
  }
  function undoRemove() {
    if (!lastRemoved) return;
    data[lastRemoved.list].splice(lastRemoved.index, 0, lastRemoved.item);
    lastRemoved = null; save(); render();
  }
  function onCoverFile(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = 300, h = Math.round(img.height * (w / img.width));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { pendingImg = c.toDataURL('image/jpeg', 0.8); } catch (e) { pendingImg = r.result; }
        $('#cover-preview').innerHTML = '<img src="' + pendingImg + '" alt="Cover photo preview"><span>Cover photo added</span>';
      };
      img.onerror = function () { $('#cover-preview').textContent = 'That file could not be read as an image. Try a JPG or PNG.'; };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
  function syncDest() {
    var toread = $('#dest-toread').checked;
    $('#lib-fields').hidden = toread;
    $('#tr-fields').hidden = !toread;
    $('#add-submit').textContent = toread ? 'Add to To Read' : 'Add to Library';
  }
  function submitAdd(e) {
    e.preventDefault();
    var title = $('#f-title').value.trim(), author = $('#f-author').value.trim(), err = $('#add-err');
    if (!title || !author) { err.textContent = 'Add a title and an author to save this book.'; (title ? $('#f-author') : $('#f-title')).focus(); return; }
    var toread = $('#dest-toread').checked;
    var pt = pointOf(null, $('#add-submit'));
    var b = { id: uid(), title: title, author: author, genre: $('#f-genre').value.trim() || 'Other', pages: parseInt($('#f-pages').value, 10) || 0 };
    if (pendingImg) b.img = pendingImg;
    if (state.isbn) b.isbn = state.isbn;
    if (state.coverUrl && !pendingImg) b.coverUrl = state.coverUrl;
    if (toread) { b.priority = $('#f-prio').value; data.toread.push(b); }
    else { b.dateRead = $('#f-date').value || iso(new Date()); b.rating = +$('#f-rating').value || 0; data.library.unshift(b); }
    save();
    closeModal();
    state.tab = toread ? 'toread' : 'library';
    state.confirm = null;
    render();
    toast((toread ? 'On the list: ' : 'On the shelf: ') + title);
    if (!toread) confetti(pt[0], pt[1]);
  }

  /* ---------- Share ---------- */
  function openShare(cardHtml, text, cls) {
    var x = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
    var th = 'https://www.threads.net/intent/post?text=' + encodeURIComponent(text);
    openModal('<div class="sheet-h"><h2 id="sheet-title">Share it</h2><button class="x" data-action="close-modal" aria-label="Close">×</button></div>'
      + '<div class="share-card ' + (cls || '') + '">' + cardHtml + '</div>'
      + '<label for="share-text" class="hint" style="display:block;margin-bottom:4px;font-weight:800">Post text</label>'
      + '<textarea class="field" id="share-text" rows="3">' + esc(text) + '</textarea>'
      + '<div class="share-actions">' + (navigator.share ? '<button class="btn primary" data-action="native-share">Share…</button>' : '') + '<button class="btn hot" data-action="copy">Copy text</button>'
      + '<a class="btn" href="' + x + '" target="_blank" rel="noopener">Post on X</a>'
      + '<a class="btn" href="' + th + '" target="_blank" rel="noopener">Post on Threads</a></div>'
      + '<p class="hint" style="margin:12px 0 0">' + (navigator.share ? 'Share… opens your phone\'s share sheet, including Messages, Instagram and Facebook.' : 'For Instagram or Facebook, copy the text and paste it into your post.') + '</p>');
  }
  function shareBook(b) {
    var text = (b.rating ? 'Just finished ' : 'Just read ') + '"' + b.title + '" by ' + b.author + (b.rating ? '. My rating: ' + stars(b.rating) + ' (' + b.rating + '/5)' : '') + '. #ReadBetween #amreading';
    openShare(cover(b) + '<div><h3>' + esc(b.title) + '</h3><p>' + esc(b.author) + '</p>' + (b.rating ? starsHtml(b.rating, false) : '') + '</div>', text);
  }
  function shareStats() {
    var s = crunch(booksInRange(data.library)), phrase = rangePhrase();
    var text = 'My reading ' + phrase + ': ' + plural(s.books, 'book') + ', ' + fmtN(s.pages) + ' pages' + (s.rated ? ', average rating ' + s.avg.toFixed(1) + '★' : '') + (s.genres[0] ? '. Top genre: ' + s.genres[0].name : '') + '. #ReadBetween';
    openShare('<div style="display:grid;gap:8px"><h3>My reading ' + esc(phrase) + '</h3><div class="share-nums"><div><b>' + fmtN(s.books) + '</b><span>Books</span></div><div><b>' + fmtN(s.pages) + '</b><span>Pages</span></div>' + (s.rated ? '<div><b>' + s.avg.toFixed(1) + '★</b><span>Avg rating</span></div>' : '') + '</div></div>', text, 'stats');
  }
  function copyShare(btn) {
    var ta = $('#share-text');
    function fallback() { ta.focus(); ta.select(); btn.textContent = 'Press Ctrl+C or ⌘C'; }
    try {
      navigator.clipboard.writeText(ta.value).then(function () { btn.textContent = 'Copied!'; }, fallback);
    } catch (e) { fallback(); }
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    if (e.target === $('#modal')) { closeModal(); return; }
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;
    var host = t.closest('[data-id]');
    var id = host ? host.dataset.id : null;
    var listName = host ? host.dataset.list : null;
    var list = listName ? data[listName] : null;
    var b, i, c, pt;
    switch (a) {
      case 'tab': state.tab = t.dataset.tab; state.confirm = null; render(); break;
      case 'add': openAdd(t.dataset.dest); break;
      case 'rate':
        b = find(data.library, id); if (!b) break;
        var v = +t.dataset.v; b.rating = b.rating === v ? 0 : v; save();
        pt = pointOf(e, t);
        $('#lib-grid').innerHTML = libGrid();
        var star = document.querySelector('#lib-grid [data-id="' + id + '"] .star[data-v="' + v + '"]');
        if (star && b.rating) { star.classList.add('pop'); star.focus(); }
        if (b.rating === 5) confetti(pt[0], pt[1]);
        break;
      case 'share-book': b = find(data.library, id); if (b) shareBook(b); break;
      case 'ask-delete': state.confirm = id; render(); break;
      case 'del-no': state.confirm = null; render(); break;
      case 'del-yes':
        i = list.findIndex(function (x) { return x.id === id; });
        if (i > -1) { lastRemoved = { list: listName, item: list[i], index: i }; list.splice(i, 1); save(); toast('Removed ' + lastRemoved.item.title, undoRemove); }
        state.confirm = null; render(); break;
      case 'undo':
        if (undoFn) { var fn = undoFn; undoFn = null; fn(); }
        $('#toast').hidden = true; break;
      case 'up': case 'down':
        i = data.toread.findIndex(function (x) { return x.id === id; });
        var j = a === 'up' ? i - 1 : i + 1;
        if (i > -1 && j >= 0 && j < data.toread.length) { var tmp = data.toread[i]; data.toread[i] = data.toread[j]; data.toread[j] = tmp; save(); render(); }
        break;
      case 'sort-priority':
        var rank = { high: 0, medium: 1, low: 2 };
        data.toread = data.toread.map(function (x, k) { return [x, k]; }).sort(function (p, q) { return rank[p[0].priority] - rank[q[0].priority] || p[1] - q[1]; }).map(function (p) { return p[0]; });
        save(); render(); toast('Sorted by priority'); break;
      case 'finish':
        i = data.toread.findIndex(function (x) { return x.id === id; });
        if (i > -1) {
          pt = pointOf(e, t);
          b = data.toread.splice(i, 1)[0];
          delete b.priority; b.dateRead = iso(new Date()); b.rating = 0;
          data.library.unshift(b); save(); render();
          confetti(pt[0], pt[1]);
          toast('Another one on the shelf! Rate it in Library.');
        }
        break;
      case 'rec-read': case 'rec-want':
        var title = t.closest('[data-title]').dataset.title;
        c = CATALOG.filter(function (x) { return x.title === title; })[0];
        if (!c) break;
        b = { id: uid(), title: c.title, author: c.author, genre: c.genre, pages: c.pages, isbn: c.isbn };
        if (a === 'rec-read') { b.dateRead = iso(new Date()); b.rating = 0; data.library.unshift(b); toast('On the shelf: ' + c.title); }
        else { b.priority = 'medium'; data.toread.push(b); toast('On the list: ' + c.title); }
        save(); render(); break;
      case 'range': state.range = t.dataset.v; render(); break;
      case 'metric': state.metric = t.dataset.v; render(); break;
      case 'share-stats': shareStats(); break;
      case 'goal-edit': state.editGoal = true; render(); var gi = $('#goal-input'); if (gi) { gi.focus(); gi.select(); } break;
      case 'goal-cancel': state.editGoal = false; render(); break;
      case 'clear-ask': state.confirmClear = true; render(); break;
      case 'clear-no': state.confirmClear = false; render(); break;
      case 'clear-yes':
        data.library = data.library.filter(function (x) { return !x.sample; });
        data.toread = data.toread.filter(function (x) { return !x.sample; });
        state.confirmClear = false; save(); render(); toast('Sample books cleared. Fresh shelf!'); break;
      case 'close-modal': closeModal(); break;
      case 'method':
        stopScan();
        state.method = t.dataset.m;
        $$('.method').forEach(function (m) { m.setAttribute('aria-pressed', String(m.dataset.m === state.method)); });
        $('#method-panel').innerHTML = methodPanel();
        if (state.method === 'scan') $('#isbn').focus();
        if (state.method === 'type') $('#f-title').focus();
        break;
      case 'lookup': lookup(); break;
      case 'scan': if (scanner) stopScan(); else startScan(); break;
      case 'native-share': if (navigator.share) navigator.share({ text: $('#share-text').value }).catch(function () {}); break;
      case 'export': exportBackup(); break;
      case 'copy': copyShare(t); break;
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'lib-q') { state.q = e.target.value; $('#lib-grid').innerHTML = libGrid(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'lib-genre') { state.genre = t.value; $('#lib-grid').innerHTML = libGrid(); }
    else if (t.id === 'lib-sort') { state.sort = t.value; $('#lib-grid').innerHTML = libGrid(); }
    else if (t.dataset.change === 'priority') {
      var b = find(data.toread, t.closest('[data-id]').dataset.id);
      if (b) { b.priority = t.value; save(); t.closest('.prio').dataset.p = t.value; }
    }
    else if (t.dataset.change === 'range-date') { state[t.id === 'stat-from' ? 'from' : 'to'] = t.value; render(); }
    else if (t.id === 'cover-file') onCoverFile(t);
    else if (t.id === 'import-file') importBackup(t);
    else if (t.name === 'dest') syncDest();
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'add-form') submitAdd(e);
    else if (e.target.id === 'goal-form') {
      e.preventDefault();
      var g = parseInt($('#goal-input').value, 10);
      if (g > 0 && g <= 365) { data.goal = g; save(); state.editGoal = false; render(); toast('Goal set: ' + plural(g, 'book') + ' this year'); }
      else $('#goal-input').focus();
    }
  });
  // Cover images: show when they load, drop back to the designed cover when they can't
  document.addEventListener('load', function (e) { if (e.target.classList && e.target.classList.contains('ol')) e.target.classList.add('ok'); }, true);
  document.addEventListener('error', function (e) { if (e.target.classList && e.target.classList.contains('ol')) e.target.remove(); }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
    if (e.key === 'Enter' && e.target.id === 'isbn') { e.preventDefault(); lookup(); }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  render();
})();
</script>
</body>
</html>
